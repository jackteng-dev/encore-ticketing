worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not log URI/query/body/cookie/auth headers. Routing evidence contains only backend/method/status.
    log_format routing '$request_method $status $upstream_addr $upstream_status';
    access_log /dev/stdout routing;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    upstream ticket_api {
        zone ticket_api 64k;
        server api-a:8080 max_fails=1 fail_timeout=3s;
        server api-b:8080 max_fails=1 fail_timeout=3s;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location = /healthz { access_log off; return 200 'GATEWAY\n'; }
        location = /api { return 404; }
        location ^~ /api/ {
            proxy_pass http://ticket_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            # This HTTP gateway is loopback/private. Never trust client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded '';
            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            # Safe read connection/timeout failover. Never enable non_idempotent or HTTP 5xx retry.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_cache off;
        }
        location ~* \.(?:js|css|woff2|png|svg|ico)$ {
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
